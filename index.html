<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cortec Calculator</title>
<meta name="theme-color" content="#1c4966">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cortec">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b5e6b'/%3E%3Ctext x='50' y='66' font-size='52' font-family='Arial,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b5e6b'/%3E%3Ctext x='50' y='66' font-size='52' font-family='Arial,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#182634;
    --muted:#5c6b7c;
    --accent:#1c4966;
    --accent-2:#2f7a9e;
    --border:#e1e6ec;
    --result-bg:#eaf2f7;
    --result-border:#c5dbe8;
    --danger:#b3441f;
    --radius:14px;
    --shadow:0 1px 3px rgba(10,25,40,.08), 0 4px 14px rgba(10,25,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1720;
      --card:#16232e;
      --text:#e8eef3;
      --muted:#8a9bab;
      --accent:#4fa8d8;
      --accent-2:#6dc3ee;
      --border:#243645;
      --result-bg:#0f2733;
      --result-border:#1e4256;
      --danger:#ff9068;
      --shadow:0 1px 3px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{overscroll-behavior-y:contain;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    overscroll-behavior-y:contain;
  }
  button{touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:inherit;}
  input{touch-action:manipulation;}

  /* Install banner (Android: real install prompt / iOS: instructions) */
  .install-bar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:9;
  }
  .install-bar .install-icon{font-size:20px;flex-shrink:0;}
  .install-bar .install-text{flex:1;font-size:12.5px;line-height:1.4;color:var(--text);}
  .install-bar .install-text b{color:var(--accent);}
  @media (prefers-color-scheme: dark){ .install-bar .install-text b{color:var(--accent-2);} }
  .install-bar .install-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    font-size:12.5px;
    font-weight:700;
    padding:8px 12px;
    border-radius:9px;
    cursor:pointer;
    flex-shrink:0;
  }
  .install-bar .install-close{
    background:none;
    border:none;
    color:var(--muted);
    font-size:18px;
    line-height:1;
    padding:4px 6px;
    cursor:pointer;
    flex-shrink:0;
  }

  main{animation:pageIn .18s ease;}
  @keyframes pageIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  header.topbar{
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;
    padding:18px 16px calc(18px + env(safe-area-inset-top,0px));
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:var(--shadow);
    position:sticky;
    top:0;
    z-index:10;
  }
  .back-btn{
    background:rgba(255,255,255,.18);
    border:none;
    color:#fff;
    font-size:15px;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:4px;
    flex-shrink:0;
  }
  .back-btn:active{background:rgba(255,255,255,.32);}
  .topbar-titles{min-width:0;}
  .topbar-titles h1{font-size:18px;margin:0;line-height:1.25;}
  .topbar-titles p{font-size:12.5px;margin:2px 0 0;opacity:.85;}
  main{
    flex:1;
    width:100%;
    max-width:640px;
    margin:0 auto;
    padding:16px 16px 32px;
  }
  footer{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  }
  footer a{color:var(--accent-2);text-decoration:none;}

  /* Dashboard */
  .dash-intro{color:var(--muted);font-size:14px;margin:2px 0 18px;}
  .calc-list{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0;}
  .calc-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    text-align:left;
    width:100%;
    color:inherit;
    font:inherit;
  }
  .calc-item:active{transform:scale(.99);}
  .calc-item .code{
    font-weight:700;
    font-size:15.5px;
    color:var(--accent);
  }
  @media (prefers-color-scheme: dark){ .calc-item .code{color:var(--accent-2);} }
  .calc-item .name{font-size:13px;color:var(--muted);margin-top:2px;}
  .chev{color:var(--muted);font-size:20px;flex-shrink:0;}

  /* Calculator page */
  .section-title{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    margin:22px 0 10px;
  }
  .section-title:first-child{margin-top:0;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
  }
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--text);
  }
  .field input[type=number]{
    width:100%;
    padding:11px 12px;
    font-size:16px;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    outline:none;
  }
  .field input[type=number]:focus{border-color:var(--accent-2);}
  .field select{
    width:100%;
    padding:11px 12px;
    font-size:15px;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    outline:none;
  }
  .field select:focus{border-color:var(--accent-2);}
  .toggle-group{display:flex;gap:8px;}
  .toggle-btn{
    flex:1;
    padding:10px 8px;
    font-size:14px;
    font-weight:700;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    cursor:pointer;
  }
  .toggle-btn.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  @media (prefers-color-scheme: dark){ .toggle-btn.active{background:var(--accent-2);border-color:var(--accent-2);color:#0d1720;} }

  .results{display:flex;flex-direction:column;gap:10px;}
  .result-card{
    background:var(--result-bg);
    border:1px solid var(--result-border);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .result-group-title{font-size:13.5px;font-weight:700;color:var(--accent);margin:0 0 8px;}
  @media (prefers-color-scheme: dark){ .result-group-title{color:var(--accent-2);} }
  .result-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    padding:6px 0;
  }
  .result-row + .result-row{border-top:1px dashed var(--result-border);}
  .result-row .label{font-size:13.5px;color:var(--text);}
  .result-row .value{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;}
  @media (prefers-color-scheme: dark){ .result-row .value{color:var(--accent-2);} }
  .result-row .value .unit{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px;}

  .example-note{
    font-size:12px;
    color:var(--muted);
    margin-top:14px;
    line-height:1.5;
  }
</style>
</head>
<body>

<header class="topbar" id="topbar"></header>
<div class="install-bar" id="installBar" hidden>
  <span class="install-icon">📲</span>
  <span class="install-text" id="installText"></span>
  <button class="install-btn" id="installBtn" hidden>Install</button>
  <button class="install-close" id="installClose" aria-label="Close">&times;</button>
</div>
<main id="app"></main>
<footer>© Support: <a href="mailto:nursultan.kadirov@ten.com">nursultan.kadirov@ten.com</a></footer>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------------
   1. CALCULATOR REGISTRY
   Add a new calculator by pushing a new entry into CALCULATORS.
   Each "type" (pipe / powder / mix) has a generic render+compute
   handler below, so a new calculator that reuses an existing formula
   shape (e.g. another "mix" product) needs zero new UI code.
--------------------------------------------------------------------- */

var CALCULATORS = [
  {
    id: "337w",
    code: "VpCI-337 W",
    title: "Pipe length & volume calculator",
    type: "pipe",
    defaults: { rate: 1.0 }
  },
  {
    id: "609",
    code: "VpCI-609",
    title: "Dosage & Mixing Calculator",
    type: "pipe_powder",
    defaults: {
      rate: 28,
      dosageOptions: [300, 500],
      wettingAgentPct: 0.5,
      maxSolubilityPct: 15,
      aqueousMethods: [
        { key: "fogging", label: "Standard Aqueous Fogging / Misting", note: "Drained spaces", options: [0.25, 0.5] },
        { key: "hydrotest", label: "Short-Term Hydrotest / Rinse", note: "1–3 months protection", options: [1.0, 1.5] },
        { key: "layup", label: "Long-Term Aqueous Layup / Flush", note: "6–24 months protection", options: [5.0, 10.0] }
      ]
    }
  },
  {
    id: "418",
    code: "VpCI-418",
    title: "Dosage Volume Calculator for Mixing with Water",
    type: "mix",
    defaults: { light: 5, normal: 7, heavy: 10 }
  },
  {
    id: "414",
    code: "VpCI-414",
    title: "Dosage Volume Calculator for Mixing with Water",
    type: "mix",
    defaults: { light: 5, normal: 10, heavy: 20 }
  }
];

/* ---------------------------------------------------------------------
   2. NUMBER FORMATTING
--------------------------------------------------------------------- */

function fmt(num, decimals){
  if (num === null || num === undefined || isNaN(num)) return "—";
  var s = num.toFixed(decimals);
  if (s.indexOf(".") !== -1) s = s.replace(/0+$/, "").replace(/\.$/, "");
  var parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return parts.join(".");
}

/* ---------------------------------------------------------------------
   3. ROUTER
--------------------------------------------------------------------- */

function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  if (!h) return { route: "dashboard" };
  var parts = h.split("/");
  if (parts[0] === "calc" && parts[1]) return { route: "calc", id: parts[1] };
  return { route: "dashboard" };
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function goHome(){ location.hash = "#/"; }
function goCalc(id){ location.hash = "#/calc/" + id; }

/* ---------------------------------------------------------------------
   4. RENDER: TOPBAR
--------------------------------------------------------------------- */

function renderTopbar(calc){
  var bar = document.getElementById("topbar");
  bar.innerHTML = "";
  if (calc){
    var back = document.createElement("button");
    back.className = "back-btn";
    back.innerHTML = "&larr; Back";
    back.onclick = goHome;
    bar.appendChild(back);

    var titles = document.createElement("div");
    titles.className = "topbar-titles";
    titles.innerHTML = "<h1>" + escapeHtml(calc.code) + "</h1><p>" + escapeHtml(calc.title) + "</p>";
    bar.appendChild(titles);
  } else {
    var titles2 = document.createElement("div");
    titles2.className = "topbar-titles";
    titles2.innerHTML = "<h1>Cortec Calculator</h1><p>Dosing calculators for Cortec VpCI products</p>";
    bar.appendChild(titles2);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
  });
}

/* ---------------------------------------------------------------------
   5. RENDER: DASHBOARD
--------------------------------------------------------------------- */

function renderDashboard(){
  renderTopbar(null);
  var app = document.getElementById("app");
  app.innerHTML = "";

  var intro = document.createElement("p");
  intro.className = "dash-intro";
  intro.textContent = "Choose a calculator:";
  app.appendChild(intro);

  var list = document.createElement("ul");
  list.className = "calc-list";

  CALCULATORS.forEach(function(calc){
    var li = document.createElement("li");
    var btn = document.createElement("button");
    btn.className = "calc-item";
    btn.onclick = function(){ goCalc(calc.id); };
    btn.innerHTML =
      '<div>' +
        '<div class="code">' + escapeHtml(calc.code) + '</div>' +
        '<div class="name">' + escapeHtml(calc.title) + '</div>' +
      '</div>' +
      '<div class="chev">&rsaquo;</div>';
    li.appendChild(btn);
    list.appendChild(li);
  });

  app.appendChild(list);
}

/* ---------------------------------------------------------------------
   6. RENDER: CALCULATOR PAGE (generic shell)
--------------------------------------------------------------------- */

function renderCalcPage(id){
  var calc = CALCULATORS.filter(function(c){ return c.id === id; })[0];
  if (!calc){ goHome(); return; }

  renderTopbar(calc);
  var app = document.getElementById("app");
  app.innerHTML = "";

  var handler = TYPE_HANDLERS[calc.type];
  if (!handler){
    app.innerHTML = '<div class="card">This calculator type is not available yet.</div>';
    return;
  }
  handler(calc, app);
}

/* ---------------------------------------------------------------------
   7. TYPE HANDLERS
   Each handler builds inputs + live results for one calculator
   "shape". New calculators of the same shape reuse these as-is.
--------------------------------------------------------------------- */

var TYPE_HANDLERS = {};

/* ---- 7a. "pipe" — VpCI-337 W -------------------------------------- */

TYPE_HANDLERS.pipe = function(calc, app){
  var state = { size: "", length: "" };
  var constants = calc.defaults;

  app.appendChild(sectionTitle("Inputs"));
  var inputsCard = card();
  inputsCard.appendChild(numberField("Pipe Size (inch, \")", state, "size", "0.1", function(){ update(); }, "e.g. 3"));
  inputsCard.appendChild(numberField("Length (meter)", state, "length", "0.1", function(){ update(); }, "e.g. 158"));
  app.appendChild(inputsCard);

  app.appendChild(sectionTitle("Results"));
  var resultsWrap = document.createElement("div");
  resultsWrap.className = "results";
  app.appendChild(resultsWrap);

  var note = document.createElement("p");
  note.className = "example-note";
  note.textContent = "Reference example: Size=3\", Length=158 m → Diameter=76.2 mm, Volume=0.72 m³, Required=0.72 L";
  app.appendChild(note);

  function update(){
    var sizeIn = parseFloat(state.size) || 0;
    var lengthM = parseFloat(state.length) || 0;
    var diameterMm = sizeIn * 25.4;
    var volumeM3 = Math.PI * Math.pow((diameterMm / 1000 / 2), 2) * lengthM;
    var requiredL = volumeM3 * constants.rate;

    resultsWrap.innerHTML = "";
    resultsWrap.appendChild(resultCard([
      { label: "Pipe Diameter", value: fmt(diameterMm, 2), unit: "mm" },
      { label: "Pipe Volume", value: fmt(volumeM3, 3), unit: "m³" },
      { label: "Required " + calc.code, value: fmt(requiredL, 3), unit: "L" }
    ]));
  }
  update();
};

/* ---- 7b. "pipe_powder" — VpCI-609 ----------------------------------
   Two independent dosing methods, picked with a top-level toggle:
   1) Dry Dusting — pipe internal volume (from size + length) × dosage
      rate (g/m3) gives the required powder; required water is derived
      from the powder's dissolving ratio (g per liter of water).
   2) Aqueous Mixing — water volume × target weight% gives the
      required powder for fogging/misting, hydrotest/rinse, or
      long-term layup. */

TYPE_HANDLERS.pipe_powder = function(calc, app){
  var constants = calc.defaults;
  var state = {
    method: "dust",
    size: "", length: "", dosage: constants.dosageOptions[0],
    aqWaterMode: "direct", water: "", aqSize: "", aqLength: "",
    aqMethod: constants.aqueousMethods[0].key, aqPct: constants.aqueousMethods[0].options[0]
  };

  app.appendChild(sectionTitle("Method"));
  var methodCard = card();
  methodCard.appendChild(toggleField("", state, "method", ["dust", "aqueous"], function(opt){
    return opt === "dust" ? "Dry Dusting (g/m³)" : "Aqueous Mixing (wt%)";
  }, function(){ renderBody(); }));
  app.appendChild(methodCard);

  var bodyWrap = document.createElement("div");
  app.appendChild(bodyWrap);

  function renderBody(){
    bodyWrap.innerHTML = "";
    if (state.method === "dust") renderDustMethod(bodyWrap);
    else renderAqueousMethod(bodyWrap);
  }

  function renderDustMethod(container){
    container.appendChild(sectionTitle("Inputs"));
    var inputsCard = card();
    inputsCard.appendChild(numberField("Pipe Size (inch, \")", state, "size", "0.1", function(){ update(); }, "e.g. 8"));
    inputsCard.appendChild(numberField("Length (meter)", state, "length", "0.1", function(){ update(); }, "e.g. 50"));
    inputsCard.appendChild(toggleField("Dosage Rate", state, "dosage", constants.dosageOptions, function(opt){ return opt + " g/m³"; }, update));
    container.appendChild(inputsCard);

    container.appendChild(sectionTitle("Results"));
    var resultsWrap = document.createElement("div");
    resultsWrap.className = "results";
    container.appendChild(resultsWrap);

    var note = document.createElement("p");
    note.className = "example-note";
    note.textContent = "Dosage range: 0.3–0.5 oz/ft³ (300–500 g/m³). Required water assumes " + calc.code + " dissolved at " + constants.rate + " g per liter of water.";
    container.appendChild(note);

    function update(){
      var sizeIn = parseFloat(state.size) || 0;
      var lengthM = parseFloat(state.length) || 0;
      var dosage = state.dosage;
      var diameterMm = sizeIn * 25.4;
      var volumeM3 = Math.PI * Math.pow((diameterMm / 1000 / 2), 2) * lengthM;
      var requiredG = volumeM3 * dosage;
      var requiredKg = requiredG / 1000;
      var waterL = requiredG / constants.rate;

      resultsWrap.innerHTML = "";
      resultsWrap.appendChild(resultCard([
        { label: "Pipe Diameter", value: fmt(diameterMm, 2), unit: "mm" },
        { label: "Pipe Volume", value: fmt(volumeM3, 3), unit: "m³" },
        { label: "Dosage Used", value: fmt(dosage, 0), unit: "g/m³" }
      ], "Pipe"));
      resultsWrap.appendChild(resultCard([
        { label: "Required " + calc.code, value: fmt(requiredG, 1), unit: "g" },
        { label: "Required " + calc.code, value: fmt(requiredKg, 3), unit: "kg" },
        { label: "Water Needed", value: fmt(waterL, 3), unit: "L" }
      ], "Dosage"));
    }
    update();
  }

  function renderAqueousMethod(container){
    var methods = constants.aqueousMethods;

    container.appendChild(sectionTitle("Inputs"));
    var inputsCard = card();
    inputsCard.appendChild(toggleField("Water Source", state, "aqWaterMode", ["direct", "pipe"], function(opt){
      return opt === "direct" ? "Enter Water Volume" : "Calculate from Pipe Size";
    }, function(){ renderWaterFields(); update(); }));
    var waterFieldsWrap = document.createElement("div");
    inputsCard.appendChild(waterFieldsWrap);
    inputsCard.appendChild(selectField("Application Method", state, "aqMethod", methods.map(function(m){
      return { value: m.key, label: m.label + " (" + m.note + ")" };
    }), function(){
      var m = currentAqMethod();
      state.aqPct = m.options[0];
      renderPctField();
      update();
    }));
    var pctWrap = document.createElement("div");
    inputsCard.appendChild(pctWrap);
    container.appendChild(inputsCard);

    container.appendChild(sectionTitle("Results"));
    var resultsWrap = document.createElement("div");
    resultsWrap.className = "results";
    container.appendChild(resultsWrap);

    var note = document.createElement("p");
    note.className = "example-note";
    note.textContent = "Powder required (kg) = Water volume (L) × (target wt% / 100). Pipe volume fills with 1 liter of water per liter (1 m³ = 1000 L). Maximum solubility is " + constants.maxSolubilityPct + "% by weight. Optional: add Cortec S-5 wetting agent at " + constants.wettingAgentPct + "% of the " + calc.code + " weight to help the mist spread evenly.";
    container.appendChild(note);

    function currentAqMethod(){
      return methods.filter(function(m){ return m.key === state.aqMethod; })[0];
    }

    function renderWaterFields(){
      waterFieldsWrap.innerHTML = "";
      if (state.aqWaterMode === "direct"){
        waterFieldsWrap.appendChild(numberField("Water Volume (L)", state, "water", "1", update, "e.g. 1000"));
      } else {
        waterFieldsWrap.appendChild(numberField("Pipe Size (inch, \")", state, "aqSize", "0.1", update, "e.g. 8"));
        waterFieldsWrap.appendChild(numberField("Length (meter)", state, "aqLength", "0.1", update, "e.g. 50"));
      }
    }

    function renderPctField(){
      pctWrap.innerHTML = "";
      var m = currentAqMethod();
      pctWrap.appendChild(toggleField("Concentration (wt%)", state, "aqPct", m.options, function(opt){ return fmt(opt, 2) + "%"; }, update));
    }

    function update(){
      var waterL, diameterMm, volumeM3;
      if (state.aqWaterMode === "pipe"){
        var sizeIn = parseFloat(state.aqSize) || 0;
        var lengthM = parseFloat(state.aqLength) || 0;
        diameterMm = sizeIn * 25.4;
        volumeM3 = Math.PI * Math.pow((diameterMm / 1000 / 2), 2) * lengthM;
        waterL = volumeM3 * 1000;
      } else {
        waterL = parseFloat(state.water) || 0;
      }

      var pct = state.aqPct;
      var requiredKg = waterL * (pct / 100);
      var requiredG = requiredKg * 1000;
      var per1000L = pct * 10;
      var wettingG = requiredG * (constants.wettingAgentPct / 100);

      resultsWrap.innerHTML = "";
      if (state.aqWaterMode === "pipe"){
        resultsWrap.appendChild(resultCard([
          { label: "Pipe Diameter", value: fmt(diameterMm, 2), unit: "mm" },
          { label: "Pipe Volume", value: fmt(volumeM3, 3), unit: "m³" },
          { label: "Water Needed", value: fmt(waterL, 1), unit: "L" }
        ], "Pipe"));
      }
      resultsWrap.appendChild(resultCard([
        { label: "Mixture Ratio", value: fmt(per1000L, 1), unit: "kg / 1000 L" },
        { label: "Required " + calc.code, value: fmt(requiredKg, 3), unit: "kg" },
        { label: "Required " + calc.code, value: fmt(requiredG, 1), unit: "g" }
      ], currentAqMethod().label));
      resultsWrap.appendChild(resultCard([
        { label: "Optional S-5 Wetting Agent", value: fmt(wettingG, 1), unit: "g" }
      ], "Optional Additive"));
    }

    renderWaterFields();
    renderPctField();
    update();
  }

  renderBody();
};

/* ---- 7c. "mix" — VpCI-418 / VpCI-414 -------------------------------- */

TYPE_HANDLERS.mix = function(calc, app){
  var state = { water: "" };
  var constants = calc.defaults;
  var LEVELS = [
    { key: "light", label: "Light Cleaning" },
    { key: "normal", label: "Normal Cleaning" },
    { key: "heavy", label: "Heavy Cleaning" }
  ];

  app.appendChild(sectionTitle("Inputs"));
  var inputsCard = card();
  inputsCard.appendChild(numberField("Volume of Water (L)", state, "water", "0.1", function(){ update(); }, "e.g. 20"));
  app.appendChild(inputsCard);

  app.appendChild(sectionTitle("Results"));
  var resultsWrap = document.createElement("div");
  resultsWrap.className = "results";
  app.appendChild(resultsWrap);

  var note = document.createElement("p");
  note.className = "example-note";
  note.textContent = calc.code + " percentages are configured independently and are never combined with another calculator.";
  app.appendChild(note);

  function update(){
    var waterL = parseFloat(state.water) || 0;

    resultsWrap.innerHTML = "";
    LEVELS.forEach(function(level){
      var pct = constants[level.key];
      var mL = waterL * 1000 * (pct / 100);
      var L = mL / 1000;
      var rc = resultCard([
        { label: "Additive (mL)", value: fmt(mL, 1), unit: "mL" },
        { label: "Additive (L)", value: fmt(L, 3), unit: "L" }
      ], level.label + " (" + fmt(pct, 2) + "%)");
      resultsWrap.appendChild(rc);
    });
  }
  update();
};

/* ---------------------------------------------------------------------
   8. SHARED UI BUILDERS
--------------------------------------------------------------------- */

function sectionTitle(text){
  var h = document.createElement("div");
  h.className = "section-title";
  h.textContent = text;
  return h;
}

function card(){
  var d = document.createElement("div");
  d.className = "card";
  return d;
}

function numberField(labelText, state, key, step, onInput, placeholder){
  var wrap = document.createElement("div");
  wrap.className = "field";
  var label = document.createElement("label");
  label.textContent = labelText;
  var input = document.createElement("input");
  input.type = "number";
  input.step = step || "any";
  input.inputMode = "decimal";
  input.placeholder = placeholder || "";
  input.value = state[key];
  input.addEventListener("input", function(){
    state[key] = input.value;
    onInput();
  });
  wrap.appendChild(label);
  wrap.appendChild(input);
  return wrap;
}

function toggleField(labelText, state, key, options, formatLabel, onChange){
  var wrap = document.createElement("div");
  wrap.className = "field";
  if (labelText){
    var label = document.createElement("label");
    label.textContent = labelText;
    wrap.appendChild(label);
  }

  var group = document.createElement("div");
  group.className = "toggle-group";
  options.forEach(function(opt){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "toggle-btn" + (state[key] === opt ? " active" : "");
    btn.textContent = formatLabel(opt);
    btn.onclick = function(){
      state[key] = opt;
      Array.prototype.forEach.call(group.children, function(b){ b.classList.remove("active"); });
      btn.classList.add("active");
      onChange();
    };
    group.appendChild(btn);
  });
  wrap.appendChild(group);
  return wrap;
}

function selectField(labelText, state, key, options, onChange){
  var wrap = document.createElement("div");
  wrap.className = "field";
  var label = document.createElement("label");
  label.textContent = labelText;
  wrap.appendChild(label);

  var select = document.createElement("select");
  options.forEach(function(opt){
    var o = document.createElement("option");
    o.value = opt.value;
    o.textContent = opt.label;
    if (state[key] === opt.value) o.selected = true;
    select.appendChild(o);
  });
  select.addEventListener("change", function(){
    state[key] = select.value;
    onChange();
  });
  wrap.appendChild(select);
  return wrap;
}

function resultCard(rows, groupTitle){
  var d = document.createElement("div");
  d.className = "result-card";
  if (groupTitle){
    var gt = document.createElement("div");
    gt.className = "result-group-title";
    gt.textContent = groupTitle;
    d.appendChild(gt);
  }
  rows.forEach(function(r){
    var row = document.createElement("div");
    row.className = "result-row";
    row.innerHTML =
      '<span class="label">' + escapeHtml(r.label) + '</span>' +
      '<span class="value">' + escapeHtml(r.value) + '<span class="unit">' + escapeHtml(r.unit) + '</span></span>';
    d.appendChild(row);
  });
  return d;
}

/* ---------------------------------------------------------------------
   9. MAIN RENDER DISPATCH
--------------------------------------------------------------------- */

function render(){
  var r = parseHash();
  if (r.route === "calc") renderCalcPage(r.id);
  else renderDashboard();

  var app = document.getElementById("app");
  app.style.animation = "none";
  void app.offsetWidth;
  app.style.animation = "";
}

render();

/* Service worker: enables offline use and lets "Add to Home Screen"
   register as a fully installable app. Only works on http(s) hosting
   (opening the file directly via file:// skips this due to browser
   restrictions — that's expected and doesn't affect anything else). */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

/* ---------------------------------------------------------------------
   10. INSTALL BANNER
   Android/Chrome: captures the native beforeinstallprompt event and
   offers a real "Install" button instead of relying on the
   browser's own menu. iOS Safari has no such API, so it gets a short
   instruction line instead. Hidden entirely once already installed
   (standalone display mode) or after the user dismisses it once.
--------------------------------------------------------------------- */

(function initInstallBanner(){
  var DISMISS_KEY = "cortec_install_banner_dismissed_v1";
  var bar = document.getElementById("installBar");
  var textEl = document.getElementById("installText");
  var btn = document.getElementById("installBtn");
  var closeBtn = document.getElementById("installClose");
  var deferredPrompt = null;

  function isStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function isDismissed(){
    try{ return localStorage.getItem(DISMISS_KEY) === "1"; }catch(e){ return false; }
  }
  function dismiss(){
    try{ localStorage.setItem(DISMISS_KEY, "1"); }catch(e){}
    bar.hidden = true;
  }

  if (isStandalone() || isDismissed()) return;

  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;

  if (isIOS){
    textEl.innerHTML = 'Install <b>Cortec Calculator</b>: tap the Share icon below, then choose "Add to Home Screen".';
    btn.hidden = true;
    bar.hidden = false;
  } else {
    window.addEventListener("beforeinstallprompt", function(e){
      e.preventDefault();
      deferredPrompt = e;
      textEl.innerHTML = 'Install <b>Cortec Calculator</b> on your phone.';
      btn.hidden = false;
      bar.hidden = false;
    });
  }

  btn.addEventListener("click", function(){
    if (!deferredPrompt) return;
    btn.disabled = true;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function(){
      deferredPrompt = null;
      bar.hidden = true;
    });
  });

  closeBtn.addEventListener("click", dismiss);

  window.addEventListener("appinstalled", function(){
    bar.hidden = true;
  });
})();

})();
</script>
